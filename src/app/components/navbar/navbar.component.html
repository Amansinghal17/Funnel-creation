<header class="navbar" [class.scrolled]="scrolled()">
  <div class="container navbar-inner">
    <a routerLink="/" class="brand" (click)="closeMenu()">
      <mat-icon aria-hidden="true">favorite</mat-icon>
      <span>Dialysis<strong>OnGo</strong></span>
    </a>

    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()" aria-label="Toggle navigation menu">
      <mat-icon>{{ menuOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <nav class="links" [class.open]="menuOpen()">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()">Home</a>
      <a routerLink="/search" routerLinkActive="active" (click)="closeMenu()">Search</a>
      <a routerLink="/clinics" routerLinkActive="active" (click)="closeMenu()">Clinics</a>
      <button mat-flat-button color="primary" routerLink="/search" (click)="closeMenu()">Book Now</button>
    </nav>
  </div>
</header>
